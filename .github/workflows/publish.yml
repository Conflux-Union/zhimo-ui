name: Publish to npm

# Publishes when a v* tag is pushed. Pair with `npm version <patch|minor|major>`
# which bumps package.json and creates the matching tag in one step, then
# `git push --follow-tags`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22's bundled npm
      # still lags, and npm@latest requires Node >= 22.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Fail fast if the pushed tag and package.json drift apart, so we never
      # publish a version that lies about itself.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm test

      # No token: npm authenticates via the OIDC id-token, validated against the
      # trusted publisher configured for this package on npmjs.com. Provenance is
      # signed automatically.
      - run: npm publish --provenance --access public
